apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-job
spec:
  template:
    spec:
      containers:
      - name: minio-mc
        image: minio/mc
        command:
        - /bin/sh
        - -c
        - |
          # Connect to MinIO
          mc alias set myminio http://minio:9000 minioadmin minioadmin
          # Create both buckets (ignores if they already exist)
          mc mb myminio/data-files --ignore-existing
          mc mb myminio/models --ignore-existing
          # Make them accessible
          mc anonymous set download myminio/data-files
          mc anonymous set download myminio/models
          echo "MinIO buckets created successfully!"
      restartPolicy: OnFailure
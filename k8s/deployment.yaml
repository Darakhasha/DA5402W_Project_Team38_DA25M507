apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taxi-api
  template:
    metadata:
      labels:
        app: taxi-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: taxi-api
          image: taxi-api
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
            
          envFrom:
            - secretRef:
                name: minio-credentials
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
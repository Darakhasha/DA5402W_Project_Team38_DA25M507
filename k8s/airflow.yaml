apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
  template:
    metadata:
      labels:
        app: airflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13
          env:
            - name: POSTGRES_USER
              value: airflow
            - name: POSTGRES_PASSWORD
              value: airflow
            - name: POSTGRES_DB
              value: airflow
          ports:
            - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
spec:
  selector:
    app: airflow-postgres
  ports:
    - port: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      initContainers:
        - name: airflow-init
          image: apache/airflow:2.10.4
          command:
            - "sh"
            - "-c"
            - |
              set -e
              mkdir -p /opt/airflow/data/raw /opt/airflow/data/processed

              echo "Waiting for PostgreSQL database..."
              until airflow db check; do
                sleep 3
              done

              echo "Initializing clean database schema..."
              airflow db init

              echo "Creating admin user..."
              airflow users create \
                --username admin \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@example.com \
                --password admin || true
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow"

      containers:
        - name: airflow
          image: apache/airflow:2.10.4
          imagePullPolicy: Always
          command:
            - "sh"
            - "-c"
            - |
              airflow scheduler &
              exec airflow webserver --port 8080
          ports:
            - containerPort: 8080
          env:
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: "/opt/airflow/dags"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: PYTHONPATH
              value: "/opt/airflow"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow"
          volumeMounts:
            - name: airflow-storage
              mountPath: /opt/airflow
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-scripts
              mountPath: /opt/airflow/scripts
            - name: airflow-src
              mountPath: /opt/airflow/src

      volumes:
        - name: airflow-storage
          persistentVolumeClaim:
            claimName: airflow-storage
        - name: airflow-dags
          configMap:
            name: airflow-dags
        - name: airflow-scripts
          configMap:
            name: airflow-scripts
        - name: airflow-src
          configMap:
            name: airflow-src

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-service
spec:
  type: NodePort
  selector:
    app: airflow
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31501
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: airflow
          image: taxi-api
          imagePullPolicy: Always
          command:
            - "sh"
            - "-c"
            - "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true && (airflow scheduler & airflow webserver)"
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: minio-credentials  
          env:
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: "/app/dags"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW_CONN_MINIO_DEFAULT
              value: >-
                {"conn_type": "aws", "extra": {"endpoint_url": "http://minio.default.svc.cluster.local:9000"}}
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@airflow-postgres.default.svc.cluster.local:5432/airflow"
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-service
spec:
  type: NodePort
  selector:
    app: airflow
  ports:
    - port: 8080
      targetPort: 8080
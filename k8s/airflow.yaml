apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      # 1. Init container handles migration and user creation safely first
      initContainers:
        - name: airflow-init
          image: apache/airflow:2.10.4
          command:
            - "sh"
            - "-c"
            - |
              echo "Waiting for PostgreSQL..."
              while ! nc -z airflow-postgres 5432; do
                sleep 2
              done
              
              echo "Checking/Initializing database schema..."
              airflow db migrate
              
              echo "Creating default admin user..."
              airflow users create \
                --username admin \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@example.com \
                --password admin || true
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@airflow-postgres.default.svc.cluster.local:5432/airflow"

      # 2. Main container only runs scheduler and webserver cleanly
      containers:
        - name: airflow
          image: apache/airflow:2.10.4
          imagePullPolicy: Always
          command:
            - "sh"
            - "-c"
            - |
              airflow scheduler &
              exec airflow webserver

          ports:
            - containerPort: 8080

          env:
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: "/app/dags"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@airflow-postgres.default.svc.cluster.local:5432/airflow"

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-service
spec:
  type: ClusterIP
  selector:
    app: airflow
  ports:
    - port: 8080
      targetPort: 8080              
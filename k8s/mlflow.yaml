apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: taxi-api #ghcr.io/mlflow/mlflow:v2.10.2
        command:
          - mlflow
          - server
          - --backend-store-uri=postgresql://airflow:airflow@airflow-postgres:5432/airflow
          - --default-artifact-root=s3://models/
          - --host=0.0.0.0
          - --port=5000
        envFrom:
          - secretRef:
              name: minio-credentials
        env:
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://minio:9000"
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: mlflow
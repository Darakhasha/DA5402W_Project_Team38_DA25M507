apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
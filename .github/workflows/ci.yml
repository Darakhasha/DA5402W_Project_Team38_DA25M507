name: CI

on:
  push:
    branches:
      - integration/newfb #feature/monitoring -

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  
    

env:
  IMAGE_NAME: ghcr.io/${{  github.repository_owner }}/taxi-api
  IMAGE_TAG: ${{ github.sha }}  
  DATA_BUCKET: "data-files"
  DATA_DEST_PATH: "data/"
  DATA_LOCAL_PATH: "dummy/"

  

jobs:
  test:

    runs-on: [self-hosted, taxi-k8s] #ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('IMAGE_NAME', `ghcr.io/${context.repo.owner.toLowerCase()}/taxi-api`);  

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.13.15"

      #- name: Check Python
      #  run: |
      #    python --version
      #    python -m pip --version    

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  setuptools wheel
          pip install -r requirements.txt

      - name: Run tests
        env:
          TESTING: "true"
        run: python -m pytest -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push  ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
 

      - name: Deploy MinIO Workload
        run: kubectl apply -f k8s/minio.yaml
        
      - name: Verify MinIO rollout
        run: kubectl rollout status deployment/minio --timeout=120s

      - name: Initialize MinIO Bucket
        run: |
          kubectl apply -f k8s/minio-init-job.yaml
          kubectl wait --for=condition=complete job/minio-init-job --timeout=60s  


      - name: Seed MinIO with Processed Data for CI Tests
        env:
          MINIO_ENDPOINT:  "http://127.0.0.1:9000"
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }} 
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }} 
        run: |
          python -c "
          import os
          import subprocess
          import time
          import sys

          print('Starting MinIO port-forwarding...')
          pf_process = subprocess.Popen(['kubectl', 'port-forward', 'deployment/minio', '9000:9000'])
          time.sleep(5) 

          try:
              access_key = os.environ.get('AWS_ACCESS_KEY_ID')
              secret_key = os.environ.get('AWS_SECRET_ACCESS_KEY')

              subprocess.run(['dvc', 'remote', 'modify', 'minio-store', 'endpointurl', 'http://127.0.0.1:9000'], check=True)
              subprocess.run(['dvc', 'remote', 'modify', '--local', 'minio-store', 'access_key_id', access_key], check=True)
              subprocess.run(['dvc', 'remote', 'modify', '--local', 'minio-store', 'secret_access_key', secret_key], check=True)
              
              # Try pulling from DVC, but don't fail the pipeline if the remote is initially empty
              try:
                  subprocess.run(['dvc', 'pull'], check=True)
              except subprocess.CalledProcessError:
                  print('Warning: DVC pull skipped or failed because remote storage is empty. Proceeding with raw data generation.')
              
              subprocess.run([sys.executable, 'scripts/process_data.py', '--input', 'data/raw/yellow_tripdata_2024-01.parquet', '--output', 'data/processed/taxi_demand_features.parquet'], check=True)
              subprocess.run([sys.executable, 'scripts/upload_file.py', '--bucket', 'data-files', '--filepath', 'data/processed/taxi_demand_features.parquet', '--dest-path', 'data/processed/taxi_demand_features.parquet'], check=True)
          finally:
              pf_process.terminate()
              pf_process.wait()
          "


      - name: Deploy Ingestion CronJob
        run: |
          kubectl apply -f k8s/pipeline-1-ingestion.yaml
          kubectl set image cronjob/pipeline-1-ingestion ingestion-container=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy Postgres Metastore
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/airflow-postgres --timeout=120s

      - name: Deploy MLflow
        run: |
          kubectl apply -f k8s/mlflow.yaml
          kubectl rollout status deployment/mlflow --timeout=120s

      - name: Trigger Model Training Job
        run: |
          kubectl apply -f k8s/pipeline-2-training.yaml
        # kubectl wait --for=condition=complete job/pipeline-2-training --timeout=300s
      
      - name: Deploy Airflow
        run: |
          kubectl apply -f k8s/airflow.yaml
          kubectl set image deployment/airflow airflow=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/airflow --timeout=300s


      - name: Deploy deployment.yml
        run: kubectl apply -f k8s/deployment.yaml

      - name: Deploy service.yml
        run: kubectl apply -f k8s/service.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/taxi-api  taxi-api=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}    

      - name: Verify Kubernetes rollout
       # shell: powershell
        run: |
          kubectl rollout status deployment/taxi-api --timeout=120s
          

      - name: Verify deployed image
       # shell: powershell
        run: python scripts/verify_deployed_image.py

      - name: Smoke test API
        #shell: powershell
        run: python scripts/smoke_test.py

      - name: Deploy Prometheus
        run: kubectl apply -f k8s/prometheus.yaml

      - name: Restart Prometheus
        run: kubectl rollout restart deployment/prometheus

      - name: Verify Prometheus rollout
        run: kubectl rollout status deployment/prometheus --timeout=120s  

      - name: Deploy Kafka
        run: kubectl apply -f k8s/kafka.yaml

      - name: Verify Kafka rollout
        run: kubectl rollout status deployment/kafka --timeout=180s  
  
      - name: Create Kafka topic
        run: |
          kubectl exec deployment/kafka -- /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic taxi-events --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1  


      - name: Verify MinIO rollout
        run: |
          kubectl rollout status deployment/minio --timeout=120s
         # kubectl wait --for=condition=ready pod -l app=minio --timeout=120s  

      - name: Deploy Permanent Cloudflare Tunnels
        run: |
          kubectl apply -f k8s/cloudflared.yaml
          kubectl rollout status deployment/cloudflare-tunnels --timeout=60s
  
      
      - name: Deploy drift monitor
        run: kubectl apply -f k8s/drift-monitor.yaml

      
      - name: Set drift monitor image
        run: kubectl set image deployment/drift-monitor drift-monitor=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      #- name: Verify drift monitor
      #  run: kubectl rollout status deployment/drift-monitor --timeout=120s    
      
      - name: Deploy simulated label producer
        run: kubectl apply -f k8s/label-producer.yaml

      - name: Set simulated label producer image
        run: kubectl set image deployment/simulated-label-producer simulated-label-producer=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      #- name: Verify simulated label producer rollout
      #  run: kubectl rollout status deployment/simulated-label-producer --timeout=120s

      - name: Verify Monitoring rollout
        run: |
          kubectl rollout status deployment/drift-monitor --timeout=300s
          kubectl rollout status deployment/simulated-label-producer --timeout=300s  

      # - name: Deploy Permanent Cloudflare Tunnels
      #   run: |
      #     kubectl apply -f k8s/cloudflared.yaml
      #     kubectl rollout status deployment/cloudflare-tunnels --timeout=60s

      - name: Configure and Push DVC
        # Securely load passwords from GitHub Secrets into the runner's memory
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          dvc remote add -d minio-store s3://data-files --force         
          dvc remote modify minio-store endpointurl http://127.0.0.1:9000          
          dvc push

      
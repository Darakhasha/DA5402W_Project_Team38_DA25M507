name: CI

on:
  push:
    branches:
      - integration/RealTime-Taxi-Demand-Forecasting

  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/taxi-api
  IMAGE_TAG: ${{ github.sha }}  
  DATA_BUCKET: "data-files"
  DATA_DEST_PATH: "data/"
  DATA_LOCAL_PATH: "dummy/"

jobs:
  test:
    runs-on: [self-hosted, taxi-k8s]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('IMAGE_NAME', `ghcr.io/${context.repo.owner.toLowerCase()}/taxi-api`);  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run tests
        env:
          TESTING: "true"
        run: python -m pytest -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MLflow image
        run: |
          docker build -f Dockerfile.mlflow -t ghcr.io/darakhasha/mlflow:${{ github.sha }} .

      - name: Push MLflow image
        run: |
          docker push ghcr.io/darakhasha/mlflow:${{ github.sha }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Clean Up Existing State
        run: |
          kubectl delete deployment minio --ignore-not-found=true --wait=true
          kubectl delete pvc -l app=minio --ignore-not-found=true
          kubectl delete pvc --all --ignore-not-found=true
          kubectl wait --for=delete pod -l app=minio --timeout=60s 
          kubectl delete deployment airflow-postgres --ignore-not-found=true
          kubectl delete svc airflow-postgres --ignore-not-found=true
          kubectl delete deployment airflow --ignore-not-found=true
          kubectl delete deployment mlflow --ignore-not-found=true
          echo "Cleaned up old workload resources and volumes."

      - name: Deploy MinIO Workload
        run: kubectl apply -f k8s/minio.yaml
        
      - name: Verify MinIO rollout
        run: kubectl rollout status deployment/minio --timeout=180s

      - name: Create MLflow Models Bucket in MinIO
        shell: python
        run: |
          import subprocess
          print('Ensuring MLflow models bucket exists in MinIO...')
          subprocess.run(['kubectl', 'exec', 'deployment/minio', '--', 'mc', 'alias', 'set', 'myminio', 'http://127.0.0.1:9000', 'minioadmin', 'minioadmin'], check=True)
          subprocess.run(['kubectl', 'exec', 'deployment/minio', '--', 'mc', 'mb', '--ignore-existing', 'myminio/models'], check=True)
          
      - name: Initialize MinIO Bucket
        run: |
          kubectl delete job minio-init-job --ignore-not-found=true
          kubectl apply -f k8s/minio-init-job.yaml
          kubectl wait --for=condition=complete job/minio-init-job --timeout=60s  

      - name: Seed MinIO with Processed Data for CI Tests
        shell: python
        env:
          MINIO_ENDPOINT: "http://127.0.0.1:9000"
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }} 
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }} 
        run: |
          import os, subprocess, time, sys

          print('Starting MinIO port-forwarding...')
          pf_process = subprocess.Popen(['kubectl', 'port-forward', 'deployment/minio', '9000:9000'])
          time.sleep(5) 

          try:
              access_key = os.environ.get('AWS_ACCESS_KEY_ID')
              secret_key = os.environ.get('AWS_SECRET_ACCESS_KEY')

              subprocess.run(['dvc', 'remote', 'modify', 'minio-store', 'endpointurl', 'http://127.0.0.1:9000'], check=True)
              subprocess.run(['dvc', 'remote', 'modify', '--local', 'minio-store', 'access_key_id', access_key], check=True)
              subprocess.run(['dvc', 'remote', 'modify', '--local', 'minio-store', 'secret_access_key', secret_key], check=True)
              
              try:
                  subprocess.run(['dvc', 'pull'], check=True)
              except subprocess.CalledProcessError:
                  print('Warning: DVC pull skipped or failed because remote storage is empty.')
              
              subprocess.run([sys.executable, 'scripts/process_data.py', '--input', 'data/raw/yellow_tripdata_2024-01.parquet', '--output', 'data/processed/taxi_demand_features.parquet'], check=True)
              subprocess.run([sys.executable, 'scripts/upload_file.py', '--bucket', 'data-files', '--filepath', 'data/processed/taxi_demand_features.parquet', '--dest-path', 'data/processed/taxi_demand_features.parquet'], check=True)
          finally:
              pf_process.terminate()
              pf_process.wait()

      - name: Deploy Ingestion CronJob
        run: |
          kubectl apply -f k8s/pipeline-1-ingestion.yaml
          kubectl set image cronjob/pipeline-1-ingestion ingestion-container=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      
      
      - name: Deploy Postgres Metastore & Prepare Databases
        shell: python
        run: |
          import subprocess, time

          print('Applying PostgreSQL manifest...')
          subprocess.run(['kubectl', 'apply', '-f', 'k8s/postgres.yaml'], check=True)

          print('Waiting for PostgreSQL container to start...')
          subprocess.run(['kubectl', 'rollout', 'status', 'deployment/airflow-postgres', '--timeout=180s'], check=True)

          print('Waiting for PostgreSQL database engine...')
          retries = 30
          while retries > 0:
              res = subprocess.run(
                  ['kubectl', 'exec', 'deployment/airflow-postgres', '--', 'pg_isready', '-U', 'airflow', '-d', 'airflow'],
                  capture_output=True
              )
              if res.returncode == 0:
                  print('PostgreSQL is ready!')
                  break
              time.sleep(2)
              retries -= 1
          else:
              raise RuntimeError("PostgreSQL engine failed to become ready within 60 seconds.")

          print('Checking MLflow database...')
          chk = subprocess.run(
              ['kubectl', 'exec', 'deployment/airflow-postgres', '--', 'psql', '-U', 'airflow', '-d', 'airflow', '-tAc', "SELECT 1 FROM pg_database WHERE datname='mlflow'"],
              capture_output=True, text=True
          )
          if '1' not in chk.stdout:
              print('Creating MLflow database...')
              subprocess.run(['kubectl', 'exec', 'deployment/airflow-postgres', '--', 'psql', '-U', 'airflow', '-d', 'airflow', '-c', 'CREATE DATABASE mlflow;'], check=True)

          print('Resetting Airflow public schema...')
          subprocess.run(['kubectl', 'exec', 'deployment/airflow-postgres', '--', 'psql', '-U', 'airflow', '-d', 'airflow', '-c', 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'], check=True)




      - name: Deploy & Restart MLflow
        run: |
          kubectl apply -f k8s/mlflow.yaml 
          kubectl set image deployment/mlflow mlflow=ghcr.io/darakhasha/mlflow:${{ github.sha }}
          kubectl rollout restart deployment/mlflow
          kubectl rollout status deployment/mlflow --timeout=400s
          

      - name: Trigger Model Training Job
        run: |
          kubectl delete -f k8s/pipeline-2-training.yaml --ignore-not-found=true
          kubectl apply -f k8s/pipeline-2-training.yaml

      - name: Deploy Airflow & Install Dependencies
        shell: python
        run: |
          import subprocess, os

          def run_cmd(cmd, check=True):
              print('--> Running: ' + ' '.join(cmd))
              res = subprocess.run(cmd, capture_output=True, text=True)
              if check and res.returncode != 0:
                  print('STDOUT:', res.stdout)
                  print('STDERR:', res.stderr)
                  raise subprocess.CalledProcessError(res.returncode, cmd, res.stdout, res.stderr)
              return res

          # 1. Apply ConfigMaps
          for cm, folder in [('airflow-dags', 'dags/'), ('airflow-src', 'src/'), ('airflow-scripts', 'scripts/')]:
              if os.path.exists(folder):
                  cm_yaml = run_cmd(['kubectl', 'create', 'configmap', cm, '--from-file=' + folder, '--dry-run=client', '-o', 'yaml']).stdout
                  p = subprocess.Popen(['kubectl', 'apply', '-f', '-'], stdin=subprocess.PIPE, text=True)
                  p.communicate(input=cm_yaml)

          # 2. Deploy Airflow
          run_cmd(['kubectl', 'apply', '-f', 'k8s/airflow.yaml'])
          run_cmd(['kubectl', 'rollout', 'status', 'deployment/airflow', '--timeout=300s'])

          # 3. Resolve active Pod name
          pod_name = run_cmd(['kubectl', 'get', 'pod', '-l', 'app=airflow', '-o', 'jsonpath={.items[0].metadata.name}']).stdout.strip()

          # 4. Create raw data path & seed dataset
          run_cmd(['kubectl', 'exec', pod_name, '-c', 'airflow', '--', 'mkdir', '-p', '/opt/airflow/data/raw'])
          local_parquet = 'data/raw/yellow_tripdata_2024-01.parquet'
          if os.path.exists(local_parquet):
              run_cmd(['kubectl', 'cp', local_parquet, pod_name + ':/opt/airflow/data/raw/yellow_tripdata_2024-01.parquet', '-c', 'airflow'])

          # 5. Install DuckDB and PySpark cleanly inside Airflow container
          run_cmd(['kubectl', 'exec', pod_name, '-c', 'airflow', '--', 'bash', '-c', 'export PIP_USER=false && python3 -m pip install duckdb pyspark'])

          # 6. Reserialize DAGs
          run_cmd(['kubectl', 'exec', pod_name, '-c', 'airflow', '--', 'airflow', 'dags', 'reserialize'])
          print('Airflow deployment and dependency installations succeeded!')

      - name: Deploy deployment.yml
        run: kubectl apply -f k8s/deployment.yaml

      - name: Deploy service.yml
        run: kubectl apply -f k8s/service.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/taxi-api taxi-api=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}    

      - name: Verify Kubernetes rollout
        run: |
          kubectl rollout status deployment/taxi-api --timeout=120s

      - name: Verify deployed image
        run: python scripts/verify_deployed_image.py

      - name: Smoke test API
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/smoke_test.py'], check=True)

      - name: Deploy Prometheus
        run: kubectl apply -f k8s/prometheus.yaml

      - name: Restart Prometheus
        run: kubectl rollout restart deployment/prometheus

      - name: Verify Prometheus rollout
        run: kubectl rollout status deployment/prometheus --timeout=120s  

      - name: Deploy Kafka
        run: kubectl apply -f k8s/kafka.yaml

      - name: Verify Kafka rollout
        run: kubectl rollout status deployment/kafka --timeout=180s  

      - name: Create Kafka topic
        run: |
          kubectl exec deployment/kafka -- /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic taxi-events --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1  

      - name: Deploy drift monitor
        run: kubectl apply -f k8s/drift-monitor.yaml

      - name: Set drift monitor image
        run: kubectl set image deployment/drift-monitor drift-monitor=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy simulated label producer
        run: kubectl apply -f k8s/label-producer.yaml

      - name: Set simulated label producer image
        run: kubectl set image deployment/simulated-label-producer simulated-label-producer=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify Monitoring rollout
        run: |
          kubectl rollout status deployment/drift-monitor --timeout=300s
          kubectl rollout status deployment/simulated-label-producer --timeout=300s  

      - name: Configure and Push DVC
        shell: python
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          import os, subprocess, time, sys

          print('Starting MinIO port-forwarding...')
          pf_process = subprocess.Popen(['kubectl', 'port-forward', 'deployment/minio', '9000:9000'])
          time.sleep(5) 

          try:
              access_key = os.environ.get('AWS_ACCESS_KEY_ID')
              secret_key = os.environ.get('AWS_SECRET_ACCESS_KEY')

              subprocess.run(['dvc', 'remote', 'add', '-d','minio-store', 's3://data-files', '--force'], check=True)		
              subprocess.run(['dvc', 'remote', 'modify', 'minio-store', 'endpointurl', 'http://127.0.0.1:9000'], check=True)
              subprocess.run(['dvc', 'push'], check=True)
                
          finally:
              pf_process.terminate()
              pf_process.wait()
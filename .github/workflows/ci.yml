name: CI

on:
  push:
    branches:
      - feature/monitoring

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  
    

env:
  IMAGE_NAME: ghcr.io/${{  github.repository_owner }}/taxi-api
  IMAGE_TAG: ${{ github.sha }}  
  

jobs:
  test:

    runs-on: [self-hosted, taxi-k8s] #ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('IMAGE_NAME', `ghcr.io/${context.repo.owner.toLowerCase()}/taxi-api`);  

      #- name: Set up Python
      #  uses: actions/setup-python@v5
      #  with:
      #    python-version: "3.13"

      #- name: Check Python
      #  run: |
      #    python --version
      #    python -m pip --version    

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push  ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/taxi-api  taxi-api=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}    

      - name: Verify Kubernetes rollout
       # shell: powershell
        run: |
          kubectl rollout status deployment/taxi-api --timeout=120s

      - name: Verify deployed image
       # shell: powershell
        run: python scripts/verify_deployed_image.py

      - name: Smoke test API
        #shell: powershell
        run: python scripts/smoke_test.py

        
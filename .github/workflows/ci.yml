name: CI

on:
  push:
    branches:
      - feature/monitoring

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  
    

env:
  IMAGE_NAME: ghcr.io/${{  github.repository_owner }}/taxi-api
  IMAGE_TAG: ${{ github.sha }}  
  DATA_BUCKET: "data-files"
  DATA_DEST_PATH: "data/"
  DATA_LOCAL_PATH: "dummy/"

  

jobs:
  test:

    runs-on: [self-hosted, taxi-k8s] #ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('IMAGE_NAME', `ghcr.io/${context.repo.owner.toLowerCase()}/taxi-api`);  

     # - name: Set up Python
